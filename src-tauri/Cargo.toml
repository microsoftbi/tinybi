[package]
name = "tinybi"
version = "0.1.0"
description = "Mac BI Desktop"
authors = ["TINYBI"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tinybi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# 优化包体积（打包 macOS .app）
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
